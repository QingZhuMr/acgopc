
name: acgopc
description: 桌面客户端
publish_to: 'none'
version: 0.1.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  window_manager: ^0.3.9
  tray_manager: ^0.2.0
  http: ^1.1.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.8.0
  web_socket_channel: ^2.4.0
  file_picker: ^8.0.0
  crop_image_pro: ^1.2.0
  silky_scroll: ^2.6.4
  local_notifier: ^0.1.5
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  asn1lib: ^1.6.5
  image: ^4.9.1
  # 【2026-08-20】liquid_glass_widgets 启用（定案见 docs/UI规范.md §11）。
  liquid_glass_widgets: ^0.30.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/app_icon.ico
    - assets/images/logo_white.png
  shaders:
    - assets/shaders/planet_shader.frag
